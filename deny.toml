[advisories]
version = 2

[licenses]
version = 2
# PaliCanon's own licence (every PaliCanon crate, ui-lib included, is
# CC-BY-NC-4.0), then permissive licences for the dependencies.
allow = [
    "CC-BY-NC-4.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # A public-domain dedication.
    "CC0-1.0",
    # Boost, permissive.
    "BSL-1.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory of the current tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
