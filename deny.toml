# What is checked is what ships: macOS (the first target) and the browser
# build of the front. A later target (Windows, Linux, iOS, Android) is added
# here when its build joins CI, with the advisories it brings.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
version = 2
ignore = [
    # Unmaintained crates reached only through leptos and leptos_i18n.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; reached only through leptos — drop when leptos moves off it (ignored 2026-10-16)" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; reached only through serde_yaml 0.9 in leptos_i18n_parser, at build time, parsing ui-lib's own locale files — drop when leptos_i18n moves off serde_yaml (ignored 2026-10-16)" },
    # The unic-* crates are one family, reached only through tauri-utils
    # (urlpattern), at build time, reading the app's own tauri.conf.json.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained; reached only through tauri-utils's urlpattern — drop when tauri moves off it (ignored 2026-10-16)" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained; reached only through tauri-utils's urlpattern — drop when tauri moves off it (ignored 2026-10-16)" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained; reached only through tauri-utils's urlpattern — drop when tauri moves off it (ignored 2026-10-16)" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained; reached only through tauri-utils's urlpattern — drop when tauri moves off it (ignored 2026-10-16)" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained; reached only through tauri-utils's urlpattern — drop when tauri moves off it (ignored 2026-10-16)" },
    # Linux only (task 013): Tauri's GTK stack and its D-Bus plugins.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; reached only through glib-macros in Tauri's GTK 0.18 stack on Linux, at build time — drop when tauri moves to GTK 4 bindings (ignored 2026-10-25)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is no longer a standalone crate; reached only through zbus (tauri-plugin-opener, tauri-plugin-single-instance, the Secret Service) on Linux — drop when zbus moves (ignored 2026-10-25)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is no longer a standalone crate; reached only through zbus on Linux, as above (ignored 2026-10-25)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is no longer a standalone crate; reached only through zbus on Linux, as above (ignored 2026-10-25)" },
]

[licenses]
version = 2
# PaliCanon's own licence (every PaliCanon crate, ui-lib included, is
# CC-BY-NC-4.0), then permissive licences for the dependencies.
allow = [
    "CC-BY-NC-4.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # A public-domain dedication.
    "CC0-1.0",
    # Boost, permissive.
    "BSL-1.0",
]
# Weak, file-level copyleft (MPL-2.0), reached through tauri's HTML and CSS
# parsing (kuchikiki, cssparser, selectors) and the directories crate:
# allowed crate by crate, not as a policy, so a new MPL crate is a decision.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # Mozilla's root certificates as data (CDLA-Permissive-2.0), a dependency
    # of rustls-platform-verifier for wasm32 only: the desktop's HTTP client
    # (reqwest, task 006) never builds for wasm32, but the graph checked here
    # includes that target for the front.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory of the current tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The private ui-lib, vizualisation (the map), learn-pali (Learn and its
# progress format) and search-front (Search), by tag, over ssh locally and
# through the CI token's https rewrite (.github/actions/private-deps);
# Cargo.lock names the ssh form.
allow-git = [
    "ssh://git@github.com/PaliCanon/ui-lib.git",
    "ssh://git@github.com/PaliCanon/vizualisation.git",
    "ssh://git@github.com/PaliCanon/learn-pali.git",
    "ssh://git@github.com/PaliCanon/search-front.git",
]
