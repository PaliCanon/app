[package]
name = "palicanon-app-desktop"
description = "The PaliCanon desktop app: a Tauri 2 shell around the front"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
palicanon_app_identity = { path = "../identity" }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[dev-dependencies]
# The mock runtime, to send the webview's IPC messages through the real ACL.
tauri = { version = "2", features = ["test"] }
# The navigation rule is run over the front's real links (tests/links.rs).
palicanon-app-front = { path = "../front" }
palicanon-ui-lib.workspace = true
serde_json.workspace = true

[lints]
workspace = true
