[package]
name = "palicanon-app-desktop"
description = "The PaliCanon desktop app: a Tauri 2 shell around the front"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
# The six command names, declared in the app manifest (build.rs).
palicanon-app-bridge = { path = "../bridge" }
tauri-build = { version = "2", features = [] }

[dependencies]
# The progress format's version and parser, from the same learn-pali tag as
# the front's Learn fragment (a newer file is refused by the same rule).
learn_core.workspace = true
log = "0.4"
palicanon-app-bridge = { path = "../bridge" }
palicanon_app_identity = { path = "../identity" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
unicode-normalization = "0.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
# The sync through the learner's Google Drive (task 006): the Drive's
# location (learn-pali 050's `drive_location`, one module for the site and
# the app), the OAuth installed-app flow (PKCE: SHA-256, base64url, the
# system's randomness), the refresh token in the macOS Keychain, the Google
# calls over rustls (ring) and a loopback listener on tokio.
base64 = "0.22"
getrandom = "0.3"
# The secret store per platform: the macOS Keychain, the Windows Credential
# Manager, the Secret Service (GNOME Keyring, KWallet) on Linux.
keyring = "3"
learn_pali.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }

# The Keychain's own error code (keyring keeps it as a platform failure's
# source): the duplicate item, and the delete by attributes. The version
# keyring 3 already uses.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# The mock runtime, to send the webview's IPC messages through the real ACL.
tauri = { version = "2", features = ["test"] }
# The navigation rule is run over the front's real links (tests/links.rs).
palicanon-app-front = { path = "../front" }
palicanon-app-bridge = { path = "../bridge" }
palicanon-ui-lib.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
