[package]
name = "palicanon-app-desktop"
description = "The PaliCanon desktop app: a Tauri 2 shell around the front"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
# The six command names, declared in the app manifest (build.rs).
palicanon-app-bridge = { path = "../bridge" }
tauri-build = { version = "2", features = [] }

[dependencies]
# The progress format's version and parser, from the same learn-pali tag as
# the front's Learn fragment (a newer file is refused by the same rule).
learn_core.workspace = true
log = "0.4"
palicanon-app-bridge = { path = "../bridge" }
palicanon_app_identity = { path = "../identity" }
# The lock on progress.lock: a safe flock (kept from when the MSRV was 1.88,
# below std's File::try_lock; ruled to stay). Already in the graph through Tauri.
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[dev-dependencies]
# The mock runtime, to send the webview's IPC messages through the real ACL.
tauri = { version = "2", features = ["test"] }
# The navigation rule is run over the front's real links (tests/links.rs).
palicanon-app-front = { path = "../front" }
palicanon-app-bridge = { path = "../bridge" }
palicanon-ui-lib.workspace = true
serde_json.workspace = true

[lints]
workspace = true
