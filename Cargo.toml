[workspace]
resolver = "3"
members = ["crates/identity", "crates/bridge", "crates/front", "crates/desktop", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "CC-BY-NC-4.0"
repository = "https://github.com/PaliCanon/app"

[workspace.dependencies]
leptos = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ui-lib by git tag, client side only (decision 2026-10-05: a service takes a
# new ui-lib by a bump commit; never a path or a [patch]). `cargo xtask pins`
# checks that exactly one revision of it is built, with `csr` and without
# `ssr` or `hydrate`.
palicanon-ui-lib = { git = "ssh://git@github.com/PaliCanon/ui-lib.git", tag = "v0.3.0", version = "0.3.0", default-features = false, features = ["csr"] }

# The map (vizualisation 012's fragment), by tag, client side only: `csr` turns
# on ui-lib's `csr` in it, so the app builds one ui-lib. Its package lives in the
# repository's `app/` directory; its data files are the repository's `public/`.
vizualisation = { git = "ssh://git@github.com/PaliCanon/vizualisation.git", tag = "v0.2.0", version = "0.1.0", default-features = false, features = ["csr"] }
# Learn (learn-pali 048's fragment) and its progress format, by one
# revision, client side only: `csr` turns on ui-lib's `csr`, no web store.
# The revision is learn-pali 050's (feat/progress-sync: the SyncTransport
# seam) until 050 is merged and tagged; then the tag.
learn_pali = { git = "ssh://git@github.com/PaliCanon/learn-pali.git", rev = "ab8110643072eb47191a3f6490087b1d0d2c7826", version = "0.1.0", default-features = false, features = ["csr"] }
learn_core = { git = "ssh://git@github.com/PaliCanon/learn-pali.git", rev = "ab8110643072eb47191a3f6490087b1d0d2c7826", version = "0.1.0" }
# Search (search-front 021's fragment), by tag, client side only.
search_front = { git = "ssh://git@github.com/PaliCanon/search-front.git", tag = "fragment-v0.1.0", version = "0.1.0", default-features = false, features = ["csr"] }
# The engine's live-view count, for the browser test (same tag, same checkout).
map-engine = { git = "ssh://git@github.com/PaliCanon/vizualisation.git", tag = "v0.2.0", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item is documented; CI denies warnings, so this is enforced.
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The browser build (Trunk, crates/front): small and fast to download.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
