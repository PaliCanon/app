[workspace]
resolver = "3"
members = ["crates/identity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "CC-BY-NC-4.0"
repository = "https://github.com/PaliCanon/app"

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item is documented; CI denies warnings, so this is enforced.
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
